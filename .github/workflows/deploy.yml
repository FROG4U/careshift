name: Deploy to Plesk

# Auto-deploy: every push to main SSHes into the Plesk server, pulls the code,
# installs deps, regenerates the Prisma client, rebuilds, and restarts Passenger.
#
# Set these repo secrets first (GitHub -> Settings -> Secrets and variables -> Actions):
#   SSH_HOST   e.g. your-plesk-server.com  (or its IP)
#   SSH_USER   your SSH / Plesk system user for the subscription
#   SSH_KEY    the PRIVATE SSH key (its public key added to the server)
#   SSH_PORT   usually 22
#   APP_PATH   absolute path to the app on the server,
#              e.g. /var/www/vhosts/pristinecaregroup.au/shift.pristinecaregroup.au
#
# NOTE: database schema is NOT auto-synced here (care data is live). When the
# Prisma schema changes, run `npx prisma db push` manually against the Supabase DB.
# Secrets (DATABASE_URL / DIRECT_URL / AUTH_SECRET) live in a server-side .env,
# never in git.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            npm ci
            npm run build
            # Restart Passenger (Plesk) by touching the restart file:
            mkdir -p tmp && touch tmp/restart.txt
            echo "✓ CareShift deployed"
